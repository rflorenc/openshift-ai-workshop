# MkDocs Material site for the workshop's participant guides. Do not edit docs/ by hand: build.sh
# regenerates it from ../lab-setup/labs/day_*/<lab>/guide (the single source) plus src/.
site_name: Red Hat OpenShift AI Hands-on Workshop
site_description: Hands-on labs for Red Hat OpenShift AI — model serving, MLOps, RAG, guardrails, agents and MCP
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  font:
    text: Noto Sans
    code: Noto Sans Mono
  icon:
    logo: material/flask-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

extra_css: [stylesheets/workshop.css]
extra_javascript: [javascripts/placeholders.js]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# nav: generated by build.sh into mkdocs.gen.yml (INHERIT: mkdocs.yml)
